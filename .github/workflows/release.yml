name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CGO_ENABLED: '1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          current="$(go run ./cmd/crwai --json version | jq -r .version)"
          test "$current" = "$GITHUB_REF_NAME"
      - name: Check
        run: make check
      - name: Verify module files
        run: git diff --exit-code go.mod go.sum

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_amd64
          - os: ubuntu-24.04-arm
            platform: linux_arm64
          - os: macos-15-intel
            platform: darwin_amd64
          - os: macos-latest
            platform: darwin_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          current="$(go run ./cmd/crwai --json version | jq -r .version)"
          test "$current" = "$GITHUB_REF_NAME"
      - name: Build package
        shell: bash
        run: |
          make build
          mkdir -p packages
          tar -C dist -czf "packages/crwai_${GITHUB_REF_NAME}_${{ matrix.platform }}.tar.gz" crwai
      - uses: actions/upload-artifact@v4
        with:
          name: crwai-${{ matrix.platform }}
          path: packages/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: crwai-*
          path: packages
          merge-multiple: true
      - name: Verify package set and publish checksums
        shell: bash
        run: |
          test "$(find packages -name '*.tar.gz' | wc -l)" -eq 4
          (cd packages && sha256sum ./*.tar.gz > checksums.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/* --verify-tag --generate-notes
